<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rain Guessr — Map Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

  :root {
    --bg:        #0a0c0f;
    --panel:     #111418;
    --border:    #2a2f38;
    --accent:    #e8c84a;
    --accent2:   #4ae8c8;
    --danger:    #e84a4a;
    --text:      #c8d0dc;
    --dim:       #5a6070;
    --region-fill:   rgba(232,200,74,0.08);
    --region-stroke: rgba(232,200,74,0.6);
    --room-fill:     rgba(74,232,200,0.06);
    --room-stroke:   rgba(74,232,200,0.5);
    --sel-fill:      rgba(232,200,74,0.25);
    --sel-stroke:    #e8c84a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* ── Top bar ── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 8px 16px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  #topbar h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    white-space: nowrap;
  }

  .step-indicator {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .step {
    padding: 4px 14px;
    border: 1px solid var(--border);
    border-radius: 2px;
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--dim);
    cursor: pointer;
    transition: all 0.15s;
  }
  .step.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(232,200,74,0.08);
  }
  .step:hover:not(.active) { border-color: var(--dim); color: var(--text); }

  .sep { width: 1px; height: 20px; background: var(--border); }

  #info-bar {
    font-size: 11px;
    color: var(--dim);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  #sel-label {
    font-size: 11px;
    color: var(--accent2);
    white-space: nowrap;
  }

  button.btn {
    padding: 5px 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  button.btn:hover { border-color: var(--accent2); color: var(--accent2); }
  button.btn.primary { border-color: var(--accent); color: var(--accent); }
  button.btn.primary:hover { background: rgba(232,200,74,0.12); }
  button.btn.danger { border-color: var(--danger); color: var(--danger); }
  button.btn.danger:hover { background: rgba(232,74,74,0.12); }
  button.btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── Main layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Canvas area ── */
  #canvas-wrap {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    cursor: crosshair;
  }

  #editor-canvas {
    position: absolute;
    top: 0; left: 0;
    image-rendering: pixelated;
  }

  /* ── Side panel ── */
  #panel {
    width: 220px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--dim);
    text-transform: uppercase;
  }

  #panel-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }

  #panel-list::-webkit-scrollbar { width: 4px; }
  #panel-list::-webkit-scrollbar-track { background: transparent; }
  #panel-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .list-item {
    padding: 5px 14px;
    font-size: 11px;
    cursor: pointer;
    border-left: 2px solid transparent;
    transition: all 0.1s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .list-item:hover { background: rgba(255,255,255,0.03); color: var(--text); }
  .list-item.selected {
    border-left-color: var(--accent);
    color: var(--accent);
    background: rgba(232,200,74,0.06);
  }

  #panel-footer {
    padding: 10px 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .coord-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
  }
  .coord-row label { color: var(--dim); width: 14px; }
  .coord-row input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 3px 6px;
    border-radius: 2px;
    width: 0;
  }
  .coord-row input:focus { outline: none; border-color: var(--accent2); }

  /* ── Status bar ── */
  #statusbar {
    padding: 4px 14px;
    background: var(--panel);
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--dim);
    display: flex;
    gap: 20px;
    flex-shrink: 0;
  }

  /* ── Loading overlay ── */
  #loading {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    z-index: 100;
    transition: opacity 0.4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading h2 { font-family: 'Orbitron', sans-serif; color: var(--accent); letter-spacing: 4px; font-size: 14px; }
  #loading-msg { font-size: 11px; color: var(--dim); }
  .spinner {
    width: 32px; height: 32px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="spinner"></div>
  <h2>RAIN GUESSR</h2>
  <div id="loading-msg">Initialising...</div>
</div>

<!-- Top bar -->
<div id="topbar">
  <h1>Map Editor</h1>
  <div class="sep"></div>
  <div class="step-indicator">
    <div class="step active" id="step1-btn" onclick="setStep(1)">① Regions</div>
    <div class="step"        id="step2-btn" onclick="setStep(2)">② Rooms</div>
  </div>
  <div class="sep"></div>
  <div id="info-bar">Scroll to zoom · Right-drag to pan · Click to select · Drag selected to move</div>
  <div id="sel-label">—</div>
  <div class="sep"></div>
  <button class="btn" onclick="document.getElementById('folder-input').click()">Open folder…</button>
  <input type="file" id="folder-input" webkitdirectory multiple hidden onchange="loadFromFiles(this.files)">
  <button class="btn" onclick="resetSelected()">Reset pos</button>
  <button class="btn danger" onclick="resetAll()">Reset all</button>
  <button class="btn primary" onclick="exportFiles()">Export edits.json ↓</button>
</div>

<!-- Main -->
<div id="main">
  <div id="canvas-wrap">
    <canvas id="editor-canvas"></canvas>
  </div>
  <div id="panel">
    <div id="panel-header" id="panel-title">Regions</div>
    <div id="panel-list"></div>
    <div id="panel-footer">
      <div class="coord-row">
        <label>X</label>
        <input type="number" id="inp-x" placeholder="—" oninput="applyCoordInput()">
      </div>
      <div class="coord-row">
        <label>Y</label>
        <input type="number" id="inp-y" placeholder="—" oninput="applyCoordInput()">
      </div>
      <button class="btn" onclick="centerSelected()">Center view on selection</button>
      <button class="btn primary" id="btn-edit-rooms" style="display:none" onclick="enterRoomEditor(selectedRegion)">Edit rooms →</button>
    </div>
  </div>
</div>

<div id="statusbar">
  <span id="status-zoom">zoom: 1.00</span>
  <span id="status-mouse">mouse: —</span>
  <span id="status-count">regions: 0 · rooms: 0</span>
</div>

<script>
// ============================================================
// CONFIG — adjust path if your editor lives elsewhere
// ============================================================
// Folder = the export directory containing index.json and one <REGION>.json per region.
// This editor defaults to the vanilla export in json/geometry/vanilla.
// If fetch is blocked (file://) or the path is wrong, use the "Open folder…" button instead.
const DATA_PATH = '../json/geometry/vanilla';
const REGION_POS_URL = '../json/region_pos.txt';
const ROOM_OFFSETS_URL = '../json/room_offsets.txt';
const MAP_DATA_URL = '../json/map-data.json';
const EDITOR_TILE_SIZE = 20;
const OFFSCREEN_W = 1200, OFFSCREEN_H = 400;   // ofscreensize in the Python script

// ============================================================
// STATE
// ============================================================
const canvas = document.getElementById('editor-canvas');
const ctx    = canvas.getContext('2d');

let step = 1; // 1 = region editor, 2 = room editor

// Pan/zoom
let panX = 0, panY = 0, zoom = 1;
let isPanning = false, panStartX = 0, panStartY = 0;

// Data
let regionPos    = {};   // { CC: [x,y], ... }  — original from file
let regionOffset = {};   // { CC: [dx,dy], ... } — editor adjustments
let roomOffset   = {};   // { "CC/cc_a01": [dx,dy], ... }
let roomOffsetInitial = {};

let regionRooms  = {};   // { CC: [ {key,pos_x,pos_y,width,height,segs}, ... ] }
let regionBounds = {};   // { CC: {minX,minY,maxX,maxY} } in map space (before offset)
let allRoomData  = {};   // key → {pos_x,pos_y,width,height,segs,region}

// Selection
let selectedRegion = null; // region abbr string
let selectedRoom   = null; // room key string
let step2Region    = null; // which region we're editing in step 2

// Drag
let isDragging = false;
let dragStartMapX = 0, dragStartMapY = 0;
let dragOrigOffset = null;

// ============================================================
// INIT
// ============================================================
window.addEventListener('DOMContentLoaded', async () => {
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  attachEvents();
  await loadData();
  setStep(1);
  fitAll();
  hideLoading();
});

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  canvas.width  = wrap.clientWidth;
  canvas.height = wrap.clientHeight;
  draw();
}

function hideLoading() {
  document.getElementById('loading').classList.add('hidden');
}

function setLoadMsg(msg) {
  document.getElementById('loading-msg').textContent = msg;
}

// ============================================================
// DATA LOADING (room geometry export: index.json plus one <REGION>.json per region)
// ============================================================
let regionInitial = {};
let roomPositions = null;   // Room positions in editor pixels, measured from bottom-left.
let roomPositionOverrides = {};
let importedRegionPositions = {};
let importedRoomOffsets = {};
let mapRoomPositions = {};

async function fetchJSON(url) {
  try { const r = await fetch(url); return r.ok ? await r.json() : null; }
  catch (e) { return null; }
}

async function fetchText(url) {
  try {
    const response = await fetch(url);
    return response.ok ? await response.text() : null;
  } catch (e) {
    return null;
  }
}

function parseRegionPositions(text) {
  const positions = {};
  (text || '').split(/\r?\n/).forEach(line => {
    const match = line.trim().match(/^(\w+):(-?\d+)x(-?\d+)$/i);
    if (match) positions[match[1].toUpperCase()] = [Number(match[2]), Number(match[3])];
  });
  return positions;
}

function parseRoomOffsets(text) {
  const offsets = {};
  (text || '').split(/\r?\n/).forEach(line => {
    const match = line.trim().match(/^([^/]+)\/([^:]+):(-?\d+)x(-?\d+)$/i);
    if (match) {
      offsets[`${match[1].toUpperCase()}/${match[2].toLowerCase()}`] =
        [Number(match[3]), Number(match[4])];
    }
  });
  return offsets;
}

function buildMapRoomPositions(mapData) {
  const positions = {};
  Object.values((mapData && mapData.rooms) || {}).forEach(rooms => {
    rooms.forEach(room => {
      if (!room.fullName || !room.position) return;
      positions[room.fullName.toLowerCase()] = [
        (room.position.x / 2) * EDITOR_TILE_SIZE,
        (room.position.y / 2 - room.height) * EDITOR_TILE_SIZE
      ];
    });
  });
  return positions;
}

async function loadData() {
  setLoadMsg('Loading map positions and region index...');
  const [index, regionPositionsText, roomOffsetsText, mapData, edits] = await Promise.all([
    fetchJSON(DATA_PATH + '/index.json'),
    fetchText(REGION_POS_URL),
    fetchText(ROOM_OFFSETS_URL),
    fetchJSON(MAP_DATA_URL),
    fetchJSON(DATA_PATH + '/edits.json')
  ]);
  importedRegionPositions = parseRegionPositions(regionPositionsText);
  importedRoomOffsets = parseRoomOffsets(roomOffsetsText);
  mapRoomPositions = buildMapRoomPositions(mapData);
  roomPositionOverrides = (edits && edits.positions) || {};

  if (!index || typeof index !== 'object') {
    document.getElementById('info-bar').textContent =
      `Could not load ${DATA_PATH}/index.json — use "Open folder…" and select json/geometry/vanilla.`;
    return;
  }
  const keys = [...new Set(Object.values(index)
    .map(entry => entry && entry.region)
    .filter(region => typeof region === 'string' && region.length > 0))].sort();

  setLoadMsg('Loading regions...');
  const jsons = {};
  await Promise.all(keys.map(async k => {
    const rooms = await fetchJSON(`${DATA_PATH}/${k}.json`);
    if (rooms) jsons[k] = { __rooms: rooms };
    else console.warn(`No ${k}.json in ${DATA_PATH}`);
  }));
  roomPositions = { ...mapRoomPositions, ...roomPositionOverrides };
  ingestAll(jsons, edits);
  if (!Object.keys(jsons).length) {
    document.getElementById('info-bar').textContent =
      `No region files found in ${DATA_PATH} — use "Open folder…" and select json/geometry/vanilla.`;
  }
}

async function loadFromFiles(fileList) {
  const jsons = {};
  let edits = null, positions = null, regionPositionsText = null, roomOffsetsText = null, mapData = null;
  const reads = [];
  for (const f of fileList) {
    const parts = (f.webkitRelativePath || f.name).split('/');
    const name = parts[parts.length - 1];
    const SKIP = ['index.json', 'report.json', 'edits.json', 'positions.json', 'region.json'];
    if (name === 'region_pos.txt') {
      reads.push(f.text().then(t => { regionPositionsText = t; }));
    } else if (name === 'room_offsets.txt') {
      reads.push(f.text().then(t => { roomOffsetsText = t; }));
    } else if (name === 'map-data.json') {
      reads.push(f.text().then(t => { mapData = JSON.parse(t); })
        .catch(e => console.warn('Bad map-data.json', e)));
    } else if (name.endsWith('.json') && !SKIP.includes(name) && parts.length >= 2) {
      // Geometry export: <game>/<REGION>.json = { room: {w,h,solid,floors,...} }
      const key = name.slice(0, -5);
      reads.push(f.text().then(t => { jsons[key] = { __rooms: JSON.parse(t) }; })
                         .catch(e => console.warn('Bad ' + name, e)));
    } else if (name === 'positions.json') {
      reads.push(f.text().then(t => { positions = JSON.parse(t); }).catch(e => console.warn('Bad positions.json', e)));
    } else if (name === 'region.json' && parts.length >= 2) {
      const key = parts[parts.length - 2];
      reads.push(f.text().then(t => { jsons[key] = JSON.parse(t); })
                         .catch(e => console.warn('Bad region.json for ' + key, e)));
    } else if (name === 'edits.json' && parts.length <= 2) {
      reads.push(f.text().then(t => { edits = JSON.parse(t); })
                         .catch(e => console.warn('Bad edits.json', e)));
    }
  }
  await Promise.all(reads);
  importedRegionPositions = parseRegionPositions(regionPositionsText);
  importedRoomOffsets = parseRoomOffsets(roomOffsetsText);
  mapRoomPositions = buildMapRoomPositions(mapData);
  roomPositionOverrides = positions || (edits && edits.positions) || {};
  roomPositions = { ...mapRoomPositions, ...roomPositionOverrides };
  ingestAll(jsons, edits);
  document.getElementById('info-bar').textContent =
    'Scroll to zoom · Right-drag to pan · Click to select · Drag selected to move';
  setStep(1);
  fitAll();
}

function ingestAll(jsons, edits) {
  regionPos = {}; regionOffset = {}; roomOffset = {}; roomOffsetInitial = {};
  regionRooms = {}; regionBounds = {}; allRoomData = {}; regionInitial = {};
  selectedRegion = null; selectedRoom = null; step2Region = null;

  Object.keys(jsons).forEach(key => {
    const baseRegionPosition = importedRegionPositions[key];
    regionPos[key] = baseRegionPosition
      ? baseRegionPosition.map(value => value * EDITOR_TILE_SIZE)
      : [0, 0];
    regionOffset[key] = [0, 0];
    regionRooms[key] = jsons[key].__rooms ? parseRooms(key, jsons[key].__rooms, roomPositions)
                                          : parseRegion(key, jsons[key]);
    regionRooms[key].forEach(r => {
      allRoomData[r.key] = r;
      const importedOffset = importedRoomOffsets[`${r.regionKey.toUpperCase()}/${r.roomName.toLowerCase()}`];
      const hasSavedPosition = Object.prototype.hasOwnProperty.call(roomPositionOverrides, r.roomName);
      roomOffset[r.key] = importedOffset && !hasSavedPosition
        ? importedOffset.map(value => value * EDITOR_TILE_SIZE)
        : [0, 0];
    });
  });

  // restore previous edits (cumulative: edits.json is re-read, never overwritten blindly)
  const savedRooms = (edits && edits.rooms) || {};
  Object.keys(savedRooms).forEach(k => {
    if (roomOffset[k]) roomOffset[k] = savedRooms[k].map(Number);
    else console.warn('edits.json: unknown room ' + k);
  });
  Object.keys(roomOffset).forEach(k => { roomOffsetInitial[k] = [...roomOffset[k]]; });
  computeRegionBounds();

  // region placement: saved position, otherwise simple shelf layout
  const savedRegions = (edits && edits.regions) || {};
  const keys = Object.keys(regionPos).sort();
  let totalArea = 0;
  keys.forEach(k => { const b = regionBounds[k]; if (b) totalArea += (b.maxX-b.minX)*(b.maxY-b.minY); });
  const maxRow = Math.sqrt(totalArea) * 1.3, gap = 400;
  let cx = 0, cy = 0, rowH = 0;
  keys.forEach(k => {
    const b = regionBounds[k];
    if (savedRegions[k]) {
      regionOffset[k] = [
        Number(savedRegions[k][0]) - regionPos[k][0],
        Number(savedRegions[k][1]) - regionPos[k][1]
      ];
    }
    else if (b) {
      if (importedRegionPositions[k]) {
        regionInitial[k] = [0, 0];
        return;
      }
      const w = b.maxX - b.minX, h = b.maxY - b.minY;
      if (cx > 0 && cx + w > maxRow) { cx = 0; cy -= rowH + gap; rowH = 0; }
      regionOffset[k] = [Math.round(cx - b.minX), Math.round(cy - b.maxY)];
      cx += w + gap; rowH = Math.max(rowH, h);
    }
    regionInitial[k] = [...regionOffset[k]];
  });

  document.getElementById('status-count').textContent =
    `regions: ${keys.length} · rooms: ${Object.keys(allRoomData).length} · region positions: ${Object.keys(importedRegionPositions).length} · room offsets: ${Object.keys(importedRoomOffsets).length}`;
}

// convert_rooms.py : 1 tuile = 20 px de room, y vers le bas dans le JSON -> converti en Y vers le haut
function parseRooms(key, obj, pos) {
  const T = 20, rooms = []; let cx = 0, cy = 0, rowH = 0;
  Object.keys(obj).sort().forEach(name => {
    const d = obj[name], W = d.w * T, H = d.h * T;
    let ox, oy;
    if (pos && pos[name]) { ox = pos[name][0]; oy = pos[name][1]; }
    else {   // pas de position connue : rangement en grille
      if (cx > 0 && cx + W > 8000) { cx = 0; cy -= rowH + 100; rowH = 0; }
      ox = cx; oy = cy - H; cx += W + 100; rowH = Math.max(rowH, H);
    }
    const px = x => ox + x * T, py = y => oy + H - y * T;
    const solid = (d.solid || []).map(poly => poly.map(q => [px(q[0]), py(q[1])]));
    const lines = solid.map(poly => poly.concat([poly[0]]));
    (d.floors || []).forEach(f => lines.push([[px(f[0]), py(f[1] + 0.5)], [px(f[2]), py(f[3] + 0.5)]]));
    (d.poles_v || []).concat(d.poles_h || []).forEach(q => lines.push([[px(q[0]), py(q[1])], [px(q[2]), py(q[3])]]));
    rooms.push({ regionKey: key, roomName: name, key: `${key}/${name}`,
      minX: ox, minY: oy, maxX: ox + W, maxY: oy + H, width: W, height: H,
      lines, solid, water: d.water ? { level: d.water.level, front: d.water.front } : null, offscreen: false });
  });
  return rooms;
}

function parseRegion(key, feat) {
  const geo = {};
  (feat.geo_features || []).forEach(f => {
    if (f.properties && f.geometry) geo[f.properties.room] = f.geometry.coordinates || [];
  });
  const rooms = [];
  (feat.room_features || []).forEach(f => {
    const ring = f.geometry && f.geometry.coordinates && f.geometry.coordinates[0];
    if (!ring || !ring.length) return;
    const xs = ring.map(p => p[0]), ys = ring.map(p => p[1]);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const name = f.properties.name;
    rooms.push({
      regionKey: key, roomName: name, key: `${key}/${name}`,
      minX, minY, maxX, maxY, width: maxX - minX, height: maxY - minY,
      lines: geo[name] || [],
      offscreen: (maxX - minX === OFFSCREEN_W && maxY - minY === OFFSCREEN_H)
    });
  });
  return rooms;
}

function computeRegionBounds() {
  regionBounds = {};
  Object.keys(regionRooms).forEach(key => {
    let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity, n=0;
    regionRooms[key].forEach(room => {
      if (room.offscreen) return;       // the offscreen box would blow up the region bounds
      const o = roomOffset[room.key] || [0,0];
      minX = Math.min(minX, room.minX + o[0]); minY = Math.min(minY, room.minY + o[1]);
      maxX = Math.max(maxX, room.maxX + o[0]); maxY = Math.max(maxY, room.maxY + o[1]);
      n++;
    });
    if (n) regionBounds[key] = { minX, minY, maxX, maxY };
  });
}

// ============================================================
// COORDINATE HELPERS
// ============================================================
// Map space → screen space
function mToS(mx, my) {
  return {
    sx: (mx - panX) * zoom + canvas.width/2,
    sy: -(my - panY) * zoom + canvas.height/2  // Y flipped: map Y up = screen Y down
  };
}
// Screen space → map space
function sToM(sx, sy) {
  return {
    mx:  (sx - canvas.width/2)  / zoom + panX,
    my: -(sy - canvas.height/2) / zoom + panY  // Y flipped
  };
}

function getRoomMapPos(room) {
  const roff = regionOffset[room.regionKey] || [0,0];
  const rpos = regionPos[room.regionKey];
  if (!rpos) return null;
  const o = roomOffset[room.key] || [0,0];
  const dx = rpos[0] + roff[0] + o[0], dy = rpos[1] + roff[1] + o[1];
  // y1 = top edge (larger Y), y2 = bottom edge — same convention as before
  return { x1: room.minX + dx, y1: room.maxY + dy, x2: room.maxX + dx, y2: room.minY + dy };
}

function getRegionScreenBounds(key) {
  const roff = regionOffset[key] || [0,0];
  const b    = regionBounds[key];
  if (!b) return null;
  const p1 = mToS(b.minX + roff[0], b.minY + roff[1]);
  const p2 = mToS(b.maxX + roff[0], b.maxY + roff[1]);
  return { x: p1.sx, y: p1.sy, w: p2.sx-p1.sx, h: p2.sy-p1.sy };
}

// ============================================================
// DRAWING
// ============================================================
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Grid
  drawGrid();

  if (step === 1) drawStep1();
  else            drawStep2();
}

function drawGrid() {
  const gridSize = 100 * zoom;
  if (gridSize < 8) return;
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const startX = ((canvas.width/2 - panX*zoom) % gridSize + gridSize) % gridSize;
  const startY = ((canvas.height/2 - panY*zoom) % gridSize + gridSize) % gridSize;
  for (let x = startX; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke();
  }
  for (let y = startY; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke();
  }
}

function drawStep1() {
  // Draw ALL regions from regionPos, not just those with parsed bounds
  Object.keys(regionPos).forEach(key => {
    const rpos = regionPos[key];
    const roff = regionOffset[key] || [0,0];
    const isSel = selectedRegion === key;
    const b = regionBounds[key];

    let p1, p2;
    if (b) {
      p1 = mToS(b.minX + roff[0], b.minY + roff[1]);
      p2 = mToS(b.maxX + roff[0], b.maxY + roff[1]);
    } else {
      // No rooms loaded — draw a placeholder box around the region origin
      const placeholderSize = 50;
      p1 = mToS(rpos[0] + roff[0] - placeholderSize, rpos[1] + roff[1] - placeholderSize);
      p2 = mToS(rpos[0] + roff[0] + placeholderSize, rpos[1] + roff[1] + placeholderSize);
    }

    const w = p2.sx - p1.sx;
    const h = p2.sy - p1.sy;

    // Region fill
    ctx.fillStyle = isSel ? 'rgba(232,200,74,0.15)' : 'rgba(232,200,74,0.05)';
    ctx.fillRect(p1.sx, p1.sy, w, h);

    // Room boundaries (only if rooms are loaded)
    if (b) {
      (regionRooms[key] || []).forEach(room => {
        if (room.offscreen) return;
        const rp = getRoomMapPos(room);
        if (!rp) return;
        const sp1 = mToS(rp.x1, rp.y2);
        const sp2 = mToS(rp.x2, rp.y1);
        ctx.strokeStyle = isSel ? 'rgba(74,232,200,0.4)' : 'rgba(74,232,200,0.15)';
        ctx.lineWidth = 0.5;
        ctx.strokeRect(sp1.sx, sp1.sy, sp2.sx-sp1.sx, sp2.sy-sp1.sy);
      });
    }

    // Region border — dashed if placeholder, solid-ish if real
    ctx.strokeStyle = isSel ? '#e8c84a' : b ? 'rgba(232,200,74,0.4)' : 'rgba(232,200,74,0.2)';
    ctx.lineWidth = isSel ? 2 : 1;
    ctx.setLineDash(isSel ? [] : b ? [6,4] : [3,6]);
    ctx.strokeRect(p1.sx, p1.sy, w, h);
    ctx.setLineDash([]);

    // Label
    if (zoom > 0.02) {
      ctx.fillStyle = isSel ? '#e8c84a' : b ? 'rgba(232,200,74,0.7)' : 'rgba(232,200,74,0.35)';
      ctx.font = `bold ${Math.max(10, Math.min(18, zoom*200))}px "Share Tech Mono", monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(key, (p1.sx+p2.sx)/2, (p1.sy+p2.sy)/2);
    }
  });
}

function drawStep2() {
  if (!step2Region) return;
  const key  = step2Region;
  const rpos = regionPos[key];
  if (!rpos) return;
  const roff = regionOffset[key] || [0,0];

  regionRooms[key].forEach(room => {
    const o = roomOffset[room.key] || [0,0];
    const isSel = selectedRoom === room.key;
    const dx = rpos[0] + roff[0] + o[0];
    const dy = rpos[1] + roff[1] + o[1];

    // Eau : rectangle bleu depuis le bas de la room, puis les solides le recouvrent
    // (remplissage evenodd) -> l'eau reste dans la géométrie (formes, pentes).
    if (room.water && room.water.level > 0) {
      const a = mToS(room.minX + dx, room.minY + dy + room.water.level * 20);
      const b = mToS(room.maxX + dx, room.minY + dy);
      ctx.fillStyle = room.water.front ? 'rgba(40,70,230,0.8)' : 'rgba(20,40,170,0.95)';
      ctx.fillRect(a.sx, a.sy, b.sx - a.sx, b.sy - a.sy);
      ctx.beginPath();
      room.solid.forEach(loop => {
        loop.forEach((pt, i) => { const sp = mToS(dx + pt[0], dy + pt[1]); if (i) ctx.lineTo(sp.sx, sp.sy); else ctx.moveTo(sp.sx, sp.sy); });
        ctx.closePath();
      });
      ctx.fillStyle = '#0a0c0f';   // = --bg
      ctx.fill('evenodd');
    }

    // Geometry strokes (already Y-up map space, no flip needed)
    ctx.strokeStyle = isSel ? '#4ae8c8' : 'rgba(74,232,200,0.5)';
    ctx.lineWidth   = isSel ? 1.5 : 0.8;
    room.lines.forEach(line => {
      if (line.length < 2) return;
      ctx.beginPath();
      line.forEach((pt, i) => {
        const sp = mToS(dx + pt[0], dy + pt[1]);
        if (i === 0) ctx.moveTo(sp.sx, sp.sy); else ctx.lineTo(sp.sx, sp.sy);
      });
      ctx.stroke();
    });

    // Bounding box
    const sp1 = mToS(room.minX + dx, room.maxY + dy);
    const sp2 = mToS(room.maxX + dx, room.minY + dy);
    ctx.strokeStyle = isSel ? '#e8c84a' : 'rgba(232,200,74,0.25)';
    ctx.lineWidth   = isSel ? 1.5 : 0.5;
    ctx.setLineDash(isSel ? [] : [4,4]);
    ctx.strokeRect(sp1.sx, sp1.sy, sp2.sx-sp1.sx, sp2.sy-sp1.sy);
    ctx.setLineDash([]);

    // Room label
    if (zoom > 0.03) {
      ctx.fillStyle = isSel ? '#e8c84a' : 'rgba(200,208,220,0.5)';
      ctx.font = `${Math.max(8, Math.min(13, zoom*100))}px "Share Tech Mono", monospace`;
      ctx.textAlign = 'center';
      ctx.fillText(room.roomName, (sp1.sx+sp2.sx)/2, (sp1.sy+sp2.sy)/2);
    }
  });
}

// ============================================================
// STEP MANAGEMENT
// ============================================================
function setStep(s) {
  // Entering step 2: use currently selected region, or first region if none selected
  if (s === 2) {
    const target = selectedRegion || step2Region || Object.keys(regionPos).sort()[0];
    if (!target) return;
    step2Region = target;
  }

  step = s;
  document.getElementById('step1-btn').classList.toggle('active', s===1);
  document.getElementById('step2-btn').classList.toggle('active', s===2);
  selectedRegion = null;
  selectedRoom   = null;

  if (s === 1) {
    document.getElementById('panel-header').textContent = 'Regions';
    document.getElementById('btn-edit-rooms').style.display = 'none';
    computeRegionBounds();
    buildPanelList(Object.keys(regionPos).sort(), key => selectRegion(key), () => selectedRegion);
  } else {
    document.getElementById('panel-header').textContent = 'Rooms — ' + step2Region;
    const rooms = (regionRooms[step2Region] || []).map(r => r.key).sort();
    buildPanelList(rooms, key => selectRoom(key), () => selectedRoom, k => k.split('/')[1]);
    fitRegion(step2Region);
  }
  updateCoordInputs();
  draw();
}

// Enter step 2 for a specific region (called from double-click or selectRegion button)
function enterRoomEditor(regionKey) {
  step2Region = regionKey;
  setStep(2);
}

function buildPanelList(keys, onSelect, getSelected, labelFn) {
  const list = document.getElementById('panel-list');
  list.innerHTML = '';
  keys.forEach(key => {
    const div = document.createElement('div');
    div.className = 'list-item' + (getSelected() === key ? ' selected' : '');
    div.textContent = labelFn ? labelFn(key) : key;
    div.title = key;
    div.onclick = () => { onSelect(key); };
    list.appendChild(div);
  });
}

function refreshPanelSelection() {
  document.querySelectorAll('.list-item').forEach(el => {
    const key = el.title;
    const isSel = step===1 ? key===selectedRegion : key===selectedRoom;
    el.classList.toggle('selected', isSel);
  });
}

// ============================================================
// SELECTION
// ============================================================
function selectRegion(key) {
  selectedRegion = key;
  selectedRoom   = null;
  document.getElementById('sel-label').textContent = `Region: ${key}`;
  document.getElementById('btn-edit-rooms').style.display = 'block';
  updateCoordInputs();
  refreshPanelSelection();
  draw();
}

function selectRoom(key) {
  selectedRoom   = key;
  selectedRegion = null;
  document.getElementById('sel-label').textContent = `Room: ${key.split('/')[1]}`;
  updateCoordInputs();
  refreshPanelSelection();
  draw();
}

function updateCoordInputs() {
  const xi = document.getElementById('inp-x');
  const yi = document.getElementById('inp-y');
  if (step===1 && selectedRegion) {
    const off = regionOffset[selectedRegion] || [0,0];
    const base = regionPos[selectedRegion] || [0,0];
    xi.value = base[0] + off[0];
    yi.value = base[1] + off[1];
  } else if (step===2 && selectedRoom) {
    const off = roomOffset[selectedRoom] || [0,0];
    xi.value = off[0];
    yi.value = off[1];
  } else {
    xi.value = '';
    yi.value = '';
  }
}

function applyCoordInput() {
  const x = parseFloat(document.getElementById('inp-x').value);
  const y = parseFloat(document.getElementById('inp-y').value);
  if (isNaN(x) || isNaN(y)) return;

  if (step===1 && selectedRegion) {
    const base = regionPos[selectedRegion] || [0,0];
    regionOffset[selectedRegion] = [x - base[0], y - base[1]];
  } else if (step===2 && selectedRoom) {
    roomOffset[selectedRoom] = [x, y];
  }
  draw();
}

function centerSelected() {
  if (step===1 && selectedRegion) {
    const roff = regionOffset[selectedRegion] || [0,0];
    const b    = regionBounds[selectedRegion];
    if (!b) return;
    panX = (b.minX + b.maxX)/2 + roff[0];
    panY = (b.minY + b.maxY)/2 + roff[1];
  } else if (step===2 && selectedRoom) {
    const room = allRoomData[selectedRoom];
    if (!room) return;
    const rp = getRoomMapPos(room);
    if (!rp) return;
    panX = (rp.x1 + rp.x2)/2;
    panY = (rp.y1 + rp.y2)/2;
  }
  draw();
}

// ============================================================
// RESET / EXPORT
// ============================================================
function resetSelected() {
  if (step===1 && selectedRegion) {
    regionOffset[selectedRegion] = [...(regionInitial[selectedRegion] || [0,0])];
    updateCoordInputs();
  } else if (step===2 && selectedRoom) {
    roomOffset[selectedRoom] = [...(roomOffsetInitial[selectedRoom] || [0,0])];
    updateCoordInputs();
  }
  draw();
}

function resetAll() {
  if (!confirm('Reset ALL positions to the state at load time?')) return;
  Object.keys(regionOffset).forEach(k => regionOffset[k] = [...(regionInitial[k] || [0,0])]);
  Object.keys(roomOffset).forEach(k   => roomOffset[k]   = [...(roomOffsetInitial[k] || [0,0])]);
  updateCoordInputs();
  draw();
}

// edits.json:
//   regions: absolute world position of each region (editor layout only)
//   rooms:   offset in room px added to that room's roomcoords (only non-zero)
function exportFiles() {
  const out = { version: 1, regions: {}, rooms: {} };
  Object.keys(regionPos).sort().forEach(k => {
    const b = regionPos[k], o = regionOffset[k] || [0,0];
    out.regions[k] = [b[0]+o[0], b[1]+o[1]];
  });
  out.positions = {};
  Object.keys(roomOffset).sort().forEach(k => {
    const v = roomOffset[k], r = allRoomData[k];
    if (r && r.solid) out.positions[r.roomName] = [r.minX + v[0], r.minY + v[1]];   // convert_rooms : absolu
    else if (v[0] !== 0 || v[1] !== 0) out.rooms[k] = v;
  });
  downloadFile('edits.json', JSON.stringify(out, null, 1), 'application/json');
}

function downloadFile(name, content, type) {
  const a = document.createElement('a');
  const url = URL.createObjectURL(new Blob([content], { type: type || 'text/plain' }));
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ============================================================
// FIT VIEW
// ============================================================
function fitAll() {
  let minX=Infinity, minY=Infinity, maxX=-Infinity, maxY=-Infinity;
  Object.keys(regionPos).forEach(key => {
    const roff = regionOffset[key] || [0,0];
    const b    = regionBounds[key];
    const rpos = regionPos[key];
    if (b) {
      minX = Math.min(minX, b.minX+roff[0]); minY = Math.min(minY, b.minY+roff[1]);
      maxX = Math.max(maxX, b.maxX+roff[0]); maxY = Math.max(maxY, b.maxY+roff[1]);
    } else {
      minX = Math.min(minX, rpos[0]+roff[0]-50); minY = Math.min(minY, rpos[1]+roff[1]-50);
      maxX = Math.max(maxX, rpos[0]+roff[0]+50); maxY = Math.max(maxY, rpos[1]+roff[1]+50);
    }
  });
  if (!isFinite(minX)) return;
  panX = (minX + maxX) / 2;
  panY = (minY + maxY) / 2;
  zoom = Math.min(
    canvas.width  / (maxX - minX + 200),
    canvas.height / (maxY - minY + 200)
  ) * 0.85;
  draw();
}

// ============================================================
// HIT TESTING
// ============================================================
function hitTestStep1(mx, my) {
  let best = null, bestArea = Infinity;
  Object.keys(regionPos).forEach(key => {
    const roff = regionOffset[key] || [0,0];
    const b    = regionBounds[key];
    const rpos = regionPos[key];

    let minX, minY, maxX, maxY;
    if (b) {
      minX = b.minX + roff[0]; minY = b.minY + roff[1];
      maxX = b.maxX + roff[0]; maxY = b.maxY + roff[1];
    } else {
      const s = 50;
      minX = rpos[0] + roff[0] - s; minY = rpos[1] + roff[1] - s;
      maxX = rpos[0] + roff[0] + s; maxY = rpos[1] + roff[1] + s;
    }

    if (mx >= minX && mx <= maxX && my >= minY && my <= maxY) {
      const area = (maxX - minX) * (maxY - minY);
      if (area < bestArea) { bestArea = area; best = key; }
    }
  });
  return best;
}

function hitTestStep2(mx, my) {
  if (!step2Region) return null;
  let best = null, bestArea = Infinity;
  (regionRooms[step2Region] || []).forEach(room => {
    const rp = getRoomMapPos(room);
    if (!rp) return;
    if (mx >= rp.x1 && mx <= rp.x2 && my >= rp.y2 && my <= rp.y1) {
      const area = room.width * room.height;
      if (area < bestArea) { bestArea = area; best = room.key; }
    }
  });
  return best;
}

// ============================================================
// EVENTS
// ============================================================
function attachEvents() {
  const wrap = document.getElementById('canvas-wrap');

  // Wheel zoom
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.85 : 1/0.85;
    const mx0 =  (e.clientX - canvas.width/2)  / zoom + panX;
    const my0 = -(e.clientY - canvas.height/2) / zoom + panY;  // Y flipped
    zoom = Math.min(Math.max(0.01, zoom * factor), 50);
    panX =  mx0 - (e.clientX - canvas.width/2)  / zoom;
    panY =  my0 + (e.clientY - canvas.height/2) / zoom;  // Y flipped
    document.getElementById('status-zoom').textContent = `zoom: ${zoom.toFixed(2)}`;
    draw();
  }, { passive: false });

  // Right-drag pan
  wrap.addEventListener('mousedown', e => {
    if (e.button === 2) {
      isPanning = true;
      panStartX = e.clientX;
      panStartY = e.clientY;
      canvas.style.cursor = 'grabbing';
      return;
    }
    if (e.button !== 0) return;

    const { mx, my } = sToM(e.clientX, e.clientY);

    if (step === 1) {
      const hit = hitTestStep1(mx, my);
      if (hit) {
        selectRegion(hit);
        // Start drag
        isDragging    = true;
        dragStartMapX = mx;
        dragStartMapY = my;
        dragOrigOffset = [...(regionOffset[hit] || [0,0])];
      } else {
        selectedRegion = null;
        document.getElementById('sel-label').textContent = '—';
        updateCoordInputs();
        refreshPanelSelection();
        draw();
      }
    } else {
      const hit = hitTestStep2(mx, my);
      if (hit) {
        // Double-click region label to enter step2 for that region is handled below
        selectRoom(hit);
        isDragging    = true;
        dragStartMapX = mx;
        dragStartMapY = my;
        dragOrigOffset = [...(roomOffset[hit] || [0,0])];
      } else {
        selectedRoom = null;
        document.getElementById('sel-label').textContent = '—';
        updateCoordInputs();
        refreshPanelSelection();
        draw();
      }
    }
  });

  wrap.addEventListener('dblclick', e => {
    if (step !== 1) return;
    const { mx, my } = sToM(e.clientX, e.clientY);
    const hit = hitTestStep1(mx, my);
    if (hit) {
      step2Region = hit;
      setStep(2);
      fitRegion(hit);
    }
  });

  window.addEventListener('mousemove', e => {
    const { mx, my } = sToM(e.clientX, e.clientY);
    document.getElementById('status-mouse').textContent =
      `map: ${Math.round(mx)}, ${Math.round(my)}`;

    if (isPanning) {
      panX -= (e.clientX - panStartX) / zoom;
      panY += (e.clientY - panStartY) / zoom;  // Y flipped: screen down = map up
      panStartX = e.clientX;
      panStartY = e.clientY;
      draw();
      return;
    }
    if (!isDragging) return;

    const dx = mx - dragStartMapX;
    const dy = my - dragStartMapY;

    if (step===1 && selectedRegion) {
      regionOffset[selectedRegion] = [
        Math.round(dragOrigOffset[0] + dx),
        Math.round(dragOrigOffset[1] + dy)
      ];
      updateCoordInputs();
      draw();
    } else if (step===2 && selectedRoom) {
      roomOffset[selectedRoom] = [
        Math.round(dragOrigOffset[0] + dx),
        Math.round(dragOrigOffset[1] + dy)
      ];
      updateCoordInputs();
      draw();
    }
  });

  window.addEventListener('mouseup', e => {
    if (e.button === 2) { isPanning = false; canvas.style.cursor = 'crosshair'; }
    if (e.button === 0) isDragging = false;
  });

  wrap.addEventListener('contextmenu', e => e.preventDefault());

  // Arrow keys for fine-tuning
  window.addEventListener('keydown', e => {
    if (document.activeElement.tagName === 'INPUT') return;
    const step_size = e.shiftKey ? 10 : 1;
    let dx=0, dy=0;
    if (e.key==='ArrowLeft')  dx=-step_size;
    if (e.key==='ArrowRight') dx= step_size;
    if (e.key==='ArrowUp')    dy= step_size;  // map Y up = positive
    if (e.key==='ArrowDown')  dy=-step_size;
    if (!dx && !dy) return;
    e.preventDefault();

    if (step===1 && selectedRegion) {
      const off = regionOffset[selectedRegion] || [0,0];
      regionOffset[selectedRegion] = [off[0]+dx, off[1]+dy];
      updateCoordInputs();
      draw();
    } else if (step===2 && selectedRoom) {
      const off = roomOffset[selectedRoom] || [0,0];
      roomOffset[selectedRoom] = [off[0]+dx, off[1]+dy];
      updateCoordInputs();
      draw();
    }
  });

  // Back to step 1 with Escape
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && step === 2) setStep(1);
  });
}

function fitRegion(key) {
  const b    = regionBounds[key];
  const roff = regionOffset[key] || [0,0];
  if (!b) return;
  panX = (b.minX + b.maxX)/2 + roff[0];
  panY = (b.minY + b.maxY)/2 + roff[1];
  zoom = Math.min(
    canvas.width  / (b.maxX - b.minX + 100),
    canvas.height / (b.maxY - b.minY + 100)
  ) * 0.85;
  draw();
}
