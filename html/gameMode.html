<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Let's play Rain Guessr.">
    <title>Rain Guessr</title>
    <link id="stylesheet" rel="stylesheet" href='../css/game-mode.css'>
    <script src="../js/style.js" defer></script>
    <script src="../js/game.js"  defer></script>
    <link rel="icon" href="../pictures/ico/survivor_head1.ico"> 
</head>
<body class="background">
    <header class="top-menu">
        <nav class="button-contain" aria-label="Main navigation">
            <a href="../index.html" id="text-button">RETURN</a>
        </nav>
        <div class="game-options">
            <button type="button" class="options-toggle" aria-expanded="false" aria-controls="settings-panel">OPTIONS</button>
            <div class="settings-panel" id="settings-panel">
                <div class="settings-header">
                    <button type="button" class="menu-close">CLOSE</button>
                </div>
                <div class="setting-row">
                    <span>Difficulty</span>
                    <div class="setting-control option-buttons" role="group" aria-label="Difficulty">
                        <button type="button" class="option-choice" data-option="difficulty" data-value="normal" onclick="setGameDifficulty('normal')">Normal</button>
                        <button type="button" class="option-choice" data-option="difficulty" data-value="hard" onclick="setGameDifficulty('hard')">Hard</button>
                    </div>
                </div>
                <div class="setting-row">
                    <label for="guess-time">Time limit</label>
                    <div class="setting-control">
                        <input id="guess-time" type="number" min="1" max="3600" step="1" value="90">
                        <span>seconds</span>
                    </div>
                </div>
                <div class="setting-row">
                    <span>Map navigation</span>
                    <div class="setting-control option-buttons" role="group" aria-label="Map navigation">
                        <button type="button" class="option-choice" data-option="navigation" data-value="flat" onclick="setNavigationMode('flat')">Flat</button>
                        <button type="button" class="option-choice" data-option="navigation" data-value="layer" onclick="setNavigationMode('layer')">Layer</button>
                    </div>
                </div>
                <div class="setting-row">
                    <label for="guess-count">Guess amount</label>
                    <input id="guess-count" type="number" min="1" max="99" step="1" value="3">
                </div>
            </div>
        </div>
    </header>
    <div class="mode-title"><p>Select a game mode</p></div>
    <ul class="mode-container">
        <li>
            <img src="../pictures/classic_mode.png" alt="easy-mode">
            <p>The Overseer</p>
            <h1 class="mode-description">A hint image is given to you, find where it came from</h1>
            <section class = "game-mode">
                <button><a href="../html/map.html" id="circle-button">NEW GAME</a></button>
            </section>
        </li>
        <li>
            <img src="../pictures/placeholder-big.png" alt="classic-mode">
            <h1>The Aesthete</h1>
            <p class="mode-description">Choose your game mode and start playing Rain Guessr!</p>
            <section class = "game-mode">
<!-- href="../html/map.html"--><button type="button" class="disable" onclick="refuse(this)"><a class="disable" id="circle-button">NEW GAME</a></button>
            </section>
        </li>
    </ul>
</body>
</html>
