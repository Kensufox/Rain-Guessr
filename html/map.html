<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rain Guessr">
    <title>Rain Guessr</title>
    <link id="stylesheet" rel="stylesheet" href='../css/map.css'>
    <script src="../js/style.js"                   defer></script>
    <script src="../js/Map/render.js"              defer></script>
    <script src="../js/Map/map_loader.js"          defer></script>
    <script src="../js/Map/room_detection.js"      defer></script>
    <script src="../js/Map/connection_loader.js"   defer></script>
    <script src="../js/moving_map_script.js"       defer></script>
    <script src="../js/Map/room_locate.js"         defer></script>
    <script src="../js/game.js"                    defer></script>
    <script src="../js/score.js"                   defer></script>

    <link rel="icon" href="../pictures/ico/survivor_head1.ico">
</head>
<body>

    <!-- Map canvases -->
    <button type="button"><a href="../index.html" id="text-button">BACK</a> </button>
            
    <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
        <canvas id="canvas-connections"></canvas>
        <canvas id="canvas-overlay"></canvas>
    </div>

    <!-- Game UI -->
    <div id="game-panel">
        <img id="challenge-image" class="loading" alt="Challenge" src="">
        <div id="selection-row">
            <span id="selection-label">SELECTED ROOM :</span>
            <span id="selected-room-name">—</span>
        </div>
        <div id="answer-row">
            <span id="answer-label">CORRECT ROOM :</span>
            <span id="answer-room-name">—</span>
        </div>
        <p id="timer">Time left: <span id="time-remaining">00:00</span></p>
        <div id="result-block">
            <p class="result-row"><span>CORRECT REGION :</span> <span id="result-region">—</span></p>
            <p class="result-row"><span id="result-time-label">TEMPS MIS :</span> <span id="result-time">—</span></p>
            <p class="result-row"><span>POINTS SCORED :</span> <span id="result-points">—</span></p>
        </div>
        <button id="btn-validate" disabled onclick="onValidate()">GUESS</button>
        <button id="btn-new-game" onclick="startGameUI()">NEW GAME</button>
    </div>

    <!-- Hover tooltip -->
    <div id="room-tooltip"></div>

    <!-- Loading overlay (map load only, not game) -->
    <div id="loading-overlay">CHARGEMENT...</div>

    <div id="layer-buttons" style="position:fixed; top:8px; right:8px; z-index:20; display:none; gap:4px;">
        <button type="button" data-layer="0" title="Couche 0 (touche 1)">C0</button>
        <button type="button" data-layer="1" title="Couche 1 (touche 2)">C1</button>
        <button type="button" data-layer="2" title="Couche 2 (touche 3)">C2</button>
    </div>

    <script>
        function updateNavUI() {
            if (typeof getNavigationState !== "function") return;
            const { type, layer } = getNavigationState();
            const box = document.getElementById("layer-buttons");
            box.style.display = type === "layer" ? "flex" : "none";
            box.querySelectorAll("button").forEach(b =>
                b.style.outline = String(layer) === b.dataset.layer ? "2px solid #ff8800" : "");
        }
        window.addEventListener("mapLoaded", updateNavUI);
        window.addEventListener("navigationChanged", updateNavUI);

        window.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll("#layer-buttons button").forEach(b => {
                b.onclick = () => setActiveLayer(+b.dataset.layer);
            });
        });

        // Raccourcis (mode couches) : 1 / 2 / 3 = couche 0 / 1 / 2 ; Espace = couche suivante, Maj+Espace = précédente
        function layerKeysActive(e) {
            if (typeof getNavigationState !== "function" || getNavigationState().type !== "layer") return false;
            return !(e.target.matches && e.target.matches("input, textarea, select"));
        }
        window.addEventListener("keydown", e => {
            if (!layerKeysActive(e)) return;
            if (e.code === "Space") {
                e.preventDefault();                       // sinon Espace "clique" le bouton qui a le focus
                if (!e.repeat) cycleLayer(e.shiftKey ? -1 : 1);
                return;
            }
            const map = { "1": 0, "2": 1, "3": 2 };
            if (e.key in map) setActiveLayer(map[e.key]);
        });
        window.addEventListener("keyup", e => {           // le clic d'un bouton se déclenche au relâchement d'Espace
            if (e.code === "Space" && layerKeysActive(e)) e.preventDefault();
        });
        
        window.gameActive = false;
        let mapReady = false;
        let timerInterval;

        // Map signals it's done loading
        window.addEventListener("mapLoaded", () => {
            mapReady = true;
            document.getElementById("loading-overlay").classList.add("hidden");
            startGameUI();
        });

        // Démarre une nouvelle partie (utilisé au chargement et par NEW GAME)
        async function startGameUI() {
            if (!mapReady) return;

            clearLocate();
            document.getElementById("answer-room-name").textContent = "—";
            document.getElementById("answer-row").classList.remove("visible");
            document.getElementById("btn-new-game").classList.remove("visible");

            window.gameActive = true;
            document.getElementById("game-panel").classList.add("visible");

            await newRound();
        }

        let timeLeft = 0;
        let timedOut = false;

        function startTimer() {
            timeLeft = window.guessTime;
            updateTimerDisplay(timeLeft);

            clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay(timeLeft);

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    onTimeout();
                }
            }, 1000);
        }

        function updateTimerDisplay(time) {
            const minutes = Math.floor(time / 60);
            const seconds = time % 60;

            document.getElementById(
                "time-remaining"
            ).textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        async function newRound() {
            // Reset UI state for a fresh round
            const img       = document.getElementById("challenge-image");
            const validateBtn = document.getElementById("btn-validate");
            const selName   = document.getElementById("selected-room-name");
            timedOut = false;
            document.getElementById("timer").style.display = "";
            document.getElementById("answer-row").classList.remove("visible");
            document.getElementById("result-block").classList.remove("visible");

            img.classList.add("loading");
            img.src = "";
            validateBtn.disabled  = true;
            validateBtn.textContent = "GUESS";
            validateBtn.style.borderColor = "";
            validateBtn.style.color       = "";
            selName.textContent = "—";
            window.guess_amount = window.maxGuesses;
            startTimer();
            if (typeof clearSelection === "function") clearSelection();

            try {
                const { roomKey, imageDataUrl } = await startGame();
                img.src = imageDataUrl;
                img.classList.remove("loading");
            } catch (e) {
                console.error("Failed to start game:", e);
            }
        }

        function onValidate() {
            if (!window.selectedRoom || !window.gameActive) return;
            window.guess_amount -= 1;
            const correct = checkAnswer(window.selectedRoom);
            let result = null;
            const btn = document.getElementById("btn-validate");
            if (correct) {
                btn.textContent = "✓ CORRECT !";
                btn.style.borderColor = "#aaffaa";
                btn.style.color       = "#aaffaa";
                result = checkResult();
            } else {
                btn.textContent = "✗ INCORRECT";
                btn.style.borderColor = "#ff6666";
                btn.style.color       = "#ff6666";
                if (window.guess_amount <= 0) {
                    result = checkResult();
                }
            }
        }

        function checkResult() {
            const result = submitGuess(window.selectedRoom);
            if (!result) return null;

            console.log(`Points earned: ${result.points}`);
            finishRound(result);
            return result;
        }

        // Fin de manche : bloque le jeu, révèle la réponse, affiche le récapitulatif et NEW GAME
        function finishRound(result = null) {
            window.gameActive = false;
            document.getElementById("btn-validate").disabled = true;
            if (timedOut) {
                const btn = document.getElementById("btn-validate");
                btn.textContent = "TIME OUT";
                btn.style.borderColor = "#ff6666";
                btn.style.color       = "#ff6666";
            }
            clearInterval(timerInterval);
            document.getElementById("time-remaining").textContent = '00:00';

            // 2) Ensuite l'affichage
            console.log(`Points earned: ${result.points}`);
            locateRoom();
            const answer = window.locatedRoom ? window.locatedRoom.split("/")[1] : window.currentRoom;
            document.getElementById("answer-room-name").textContent = answer;
            document.getElementById("answer-row").classList.add("visible");

            // Récapitulatif (remplace "Time left")
            const taken = Math.max(0, window.guessTime - timeLeft);
            const mm = String(Math.floor(taken / 60)).padStart(2, "0");
            const ss = String(taken % 60).padStart(2, "0");

            const regionEl = document.getElementById("result-region");
            const sameRegion = !!(result && result.sameRegion);
            regionEl.textContent = sameRegion ? "YES" : "NO";
            regionEl.style.color = sameRegion ? "#aaffaa" : "#ff6666";

            const timeEl = document.getElementById("result-time");
            if (timedOut) {
                document.getElementById("result-time-label").textContent = "";
                timeEl.textContent = "TIME OUT";
                timeEl.style.color = "#ff6666";
            } else {
                document.getElementById("result-time-label").textContent = "TIME TAKEN :";
                timeEl.textContent = `${mm}:${ss}`;
                timeEl.style.color = "";
            }

            document.getElementById("result-points").textContent = result ? result.points : 0;

            document.getElementById("timer").style.display = "none";
            document.getElementById("result-block").classList.add("visible");
            document.getElementById("btn-new-game").classList.add("visible");
        }

        function onTimeout() {
            if (!window.gameActive) return;
            timedOut = true;
            // Une room est sélectionnée : on la soumet. Sinon (ou si ça échoue) on termine simplement la manche.
            if (!(window.selectedRoom && checkResult())) finishRound();
        }
    </script>
</body>
</html>
